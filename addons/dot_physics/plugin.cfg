[plugin]

name="dot-physics"
description="Physics as a choice rather than a default: named collision layouts a game picks from instead of writing bit arithmetic, engine profiles named for how they feel, a surface table with friction, restitution and density, and casts written against layer names. Applies to a running project and puts back what it overwrote. Depends only on dot-core."
author="dot"
version="0.1.0"
script="dot_physics_plugin.gd"
